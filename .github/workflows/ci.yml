name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  engine-tests:
    name: Go Engine Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: engine/go.sum

      - name: Install restic
        run: |
          sudo apt-get update && sudo apt-get install -y restic

      - name: Run Go Vet
        run: |
          cd engine && go vet ./...

      - name: Run Engine Tests
        run: |
          cd engine && go test -v -race ./...

      - name: Build Binary
        run: |
          mkdir -p bin
          cd engine && go build -o ../bin/carryover ./cmd/carryover

      - name: Run CLI Integration Tests
        run: |
          go test -v ./tests/integration/...

      - name: Run Local Test Matrix
        run: |
          ./scripts/test-matrix.sh standalone

  ui-tests:
    name: UI Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: |
          cd ui && npm ci

      - name: Run Svelte check and build
        run: |
          cd ui && npm run check && npm run build

  packaging:
    name: Verify Package Builds
    runs-on: ubuntu-latest
    needs: [ engine-tests, ui-tests ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Debian Package
        run: |
          ./packaging/build-packages.sh
          dpkg-deb -c dist/carryover_1.0.0_amd64.deb
