name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build Multi-Distribution Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Full Stack
        run: |
          make build

      - name: Build Packages (.deb and AppDir)
        run: |
          ./packaging/build-packages.sh

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum carryover_* > SHA256SUMS.txt

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/carryover_*.deb
            dist/carryover_*.tar.gz
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
